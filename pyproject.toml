[project]
name = "einvoice-api"
version = "0.1.0"
description = "Dummy InvoiceNow (Peppol) SMP Access Point API — the business API the e-invoice MCP server wraps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.22",
    "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
